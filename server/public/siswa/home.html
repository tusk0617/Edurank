<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FrontSchooler — Daftar Ujian</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #378ADD; --secondary: #639922; --danger: #E24B4A;
    --warning: #EF9F27; --success: #22C55E;
    --bg: #F8F9FA; --card: #ffffff; --text: #1A1A1A;
    --muted: #6B7280; --border: #E5E7EB;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); min-height: 100vh; }
  header { background: var(--card); border-bottom: 1px solid var(--border);
    padding: 14px 20px; display: flex; justify-content: space-between;
    align-items: center; position: sticky; top: 0; z-index: 10; }
  .header-left .greeting { font-size: 12px; color: var(--muted); }
  .header-left .nama { font-size: 17px; font-weight: 800; color: var(--text); }
  .avatar { width: 38px; height: 38px; border-radius: 50%;
    background: var(--secondary); color: #fff; font-weight: 800;
    font-size: 14px; display: flex; align-items: center; justify-content: center; }
  main { padding: 20px; max-width: 600px; margin: 0 auto; }
  .section-title { font-size: 15px; font-weight: 700; color: var(--text);
    margin-bottom: 14px; }
  .card { background: var(--card); border-radius: 14px; padding: 16px;
    margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
  .card-top { display: flex; justify-content: space-between;
    align-items: center; margin-bottom: 8px; }
  .mapel-row { display: flex; align-items: center; gap: 6px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; }
  .mapel-text { font-size: 12px; font-weight: 600; }
  .badge { display: inline-flex; align-items: center; gap: 4px;
    padding: 3px 10px; border-radius: 10px; font-size: 11px; font-weight: 700; }
  .card-title { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 2px; }
  .card-modul { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
  .info-row { display: flex; gap: 14px; margin-bottom: 12px; flex-wrap: wrap; }
  .info-item { display: flex; align-items: center; gap: 4px;
    font-size: 12px; color: var(--muted); }
  .btn-start { width: 100%; padding: 12px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 700; color: #fff; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 8px; }
  .empty { text-align: center; padding: 60px 20px; color: var(--muted); }
  .empty-icon { font-size: 48px; margin-bottom: 12px; }
  .logout-btn { background: none; border: none; color: var(--danger);
    font-size: 13px; font-weight: 600; cursor: pointer; padding: 4px 8px; }
  .spinner { display: inline-block; width: 24px; height: 24px;
    border: 3px solid var(--border); border-top-color: var(--primary);
    border-radius: 50%; animation: spin .7s linear infinite; margin: 40px auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .loading-wrap { display: flex; justify-content: center; }
</style>
</head>
<body>
<header>
  <div class="header-left">
    <div class="greeting" id="greeting">Selamat datang,</div>
    <div class="nama" id="namaUser">—</div>
  </div>
  <div style="display:flex;align-items:center;gap:12px">
    <button class="logout-btn" onclick="handleLogout()">Keluar</button>
    <div class="avatar" id="avatarEl">?</div>
  </div>
</header>

<main>
  <div class="section-title">Daftar Ujian</div>
  <div id="content"><div class="loading-wrap"><div class="spinner"></div></div></div>
</main>

<script>
  const token = localStorage.getItem('fs_token');
  if (!token) window.location.href = '/siswa';

  const nama     = localStorage.getItem('fs_nama') || 'Siswa';
  const username = localStorage.getItem('fs_username') || '';

  // Header
  const h = new Date().getHours();
  document.getElementById('greeting').textContent =
    h < 11 ? 'Selamat Pagi,' : h < 15 ? 'Selamat Siang,' : h < 18 ? 'Selamat Sore,' : 'Selamat Malam,';
  document.getElementById('namaUser').textContent = nama + ' 👋';
  document.getElementById('avatarEl').textContent = (username[0] || 'S').toUpperCase() + (username[1] || '');

  const STATUS = {
    tersedia:    { label: 'Tersedia',   color: '#378ADD', bg: '#EBF4FF' },
    remedial:    { label: 'Remedial',   color: '#EF9F27', bg: '#FFF8EC' },
    lulus:       { label: 'Lulus',      color: '#22C55E', bg: '#F0FDF4' },
    tidak_lulus: { label: 'Tdk Lulus',  color: '#E24B4A', bg: '#FEF2F2' },
    habis:       { label: 'Habis',      color: '#6B7280', bg: '#F3F4F6' },
  };

  function getStatus(item) {
    if (!item.status_terakhir) return 'tersedia';
    if (item.status_terakhir === 'lulus') return 'lulus';
    if (item.status_terakhir === 'remedial') return 'remedial';
    if ((item.jumlah_percobaan || 0) >= item.max_retake) return 'habis';
    return 'tersedia';
  }

  async function load() {
    try {
      const res  = await fetch('/api/assessment', { headers: { Authorization: `Bearer ${token}` } });
      if (res.status === 401) { localStorage.clear(); window.location.href = '/siswa'; return; }
      const data = await res.json();
      render(data);
    } catch {
      document.getElementById('content').innerHTML =
        '<p style="text-align:center;color:var(--danger);padding:40px">Gagal memuat data. Periksa koneksi internet.</p>';
    }
  }

  function render(list) {
    if (!list.length) {
      document.getElementById('content').innerHTML =
        '<div class="empty"><div class="empty-icon">📄</div><p>Belum ada ujian tersedia</p></div>';
      return;
    }

    document.getElementById('content').innerHTML = list.map(item => {
      const s   = getStatus(item);
      const cfg = STATUS[s];
      const sisa = item.max_retake - (item.jumlah_percobaan || 0);
      const bisa = s === 'tersedia' || s === 'remedial';
      const btnColor = s === 'remedial' ? '#EF9F27' : '#639922';
      const btnLabel = s === 'remedial' ? '🔄 Ikuti Remedial' : '▶ Mulai Ujian';
      const dotColor = item.warna_hex || '#378ADD';

      return `
        <div class="card">
          <div class="card-top">
            <div class="mapel-row">
              <div class="dot" style="background:${dotColor}"></div>
              <span class="mapel-text" style="color:${dotColor}">${item.nama_mapel}</span>
            </div>
            <span class="badge" style="color:${cfg.color};background:${cfg.bg}">${cfg.label}</span>
          </div>
          <div class="card-title">${item.judul}</div>
          <div class="card-modul">${item.nama_modul}</div>
          <div class="info-row">
            <div class="info-item">⏱ ${item.durasi_menit} menit</div>
            ${sisa > 0 ? `<div class="info-item">🔄 ${sisa} percobaan tersisa</div>` : ''}
            ${item.skor_terbaik != null ? `<div class="info-item">⭐ Skor: ${Math.round(item.skor_terbaik)}</div>` : ''}
          </div>
          ${bisa ? `<button class="btn-start" style="background:${btnColor}"
            onclick="mulaiAssessment(${item.id})">${btnLabel}</button>` : ''}
        </div>`;
    }).join('');
  }

  function mulaiAssessment(id) {
    window.location.href = `/siswa/assessment?id=${id}`;
  }

  function handleLogout() {
    if (!confirm('Yakin ingin keluar?')) return;
    localStorage.clear();
    window.location.href = '/siswa';
  }

  load();
</script>
</body>
</html>
