<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FrontSchooler — Assessment</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #378ADD; --secondary: #639922; --danger: #E24B4A;
    --warning: #EF9F27; --success: #22C55E;
    --bg: #F8F9FA; --card: #fff; --text: #1A1A1A; --muted: #6B7280; --border: #E5E7EB;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); min-height: 100vh; }

  /* ── HEADER ── */
  .header { background: var(--card); border-bottom: 1px solid var(--border);
    padding: 12px 16px; display: flex; align-items: center; gap: 12px;
    position: sticky; top: 0; z-index: 20; }
  .btn-close { background: none; border: none; font-size: 22px; cursor: pointer;
    color: var(--text); padding: 4px; line-height: 1; }
  .header-center { flex: 1; }
  .progress-label { font-size: 11px; color: var(--muted); margin-bottom: 4px; }
  .progress-track { height: 5px; background: var(--border); border-radius: 3px; overflow: hidden; }
  .progress-fill { height: 100%; background: var(--primary);
    border-radius: 3px; transition: width .3s; }
  .timer { padding: 6px 12px; border-radius: 8px; background: var(--primary);
    color: #fff; font-size: 14px; font-weight: 700; min-width: 58px; text-align: center; }
  .timer.urgent { background: var(--danger); }
  .violation-badge { padding: 4px 8px; border-radius: 8px;
    background: #FEF2F2; color: var(--danger); font-size: 11px; font-weight: 700; }

  /* ── SOAL ── */
  .soal-wrap { padding: 20px 16px; max-width: 600px; margin: 0 auto; }
  .soal-num { font-size: 12px; color: var(--muted); font-weight: 600; margin-bottom: 12px; }
  .soal-text { font-size: 16px; font-weight: 600; color: var(--text);
    line-height: 1.6; margin-bottom: 20px; }
  .opsi { display: flex; align-items: flex-start; gap: 12px; padding: 14px;
    border: 1.5px solid var(--border); border-radius: 10px; margin-bottom: 10px;
    cursor: pointer; background: var(--card); transition: all .15s; }
  .opsi:hover { border-color: var(--primary); background: #EBF4FF; }
  .opsi.selected { border-color: var(--primary); background: #EBF4FF; }
  .opsi-circle { width: 32px; height: 32px; border-radius: 50%; border: 1.5px solid var(--border);
    display: flex; align-items: center; justify-content: center; font-weight: 700;
    font-size: 13px; flex-shrink: 0; color: var(--text); }
  .opsi.selected .opsi-circle { background: var(--primary); border-color: var(--primary); color: #fff; }
  .opsi-text { font-size: 14px; color: var(--text); line-height: 1.5; padding-top: 4px; }

  /* ── NAVIGASI ── */
  .nav-bar { position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--card); border-top: 1px solid var(--border);
    padding: 12px 16px; display: flex; justify-content: space-between;
    align-items: center; gap: 12px; max-width: 600px; margin: 0 auto; }
  .btn-nav { padding: 10px 20px; border: 1.5px solid var(--primary); border-radius: 8px;
    background: none; color: var(--primary); font-weight: 600; font-size: 14px;
    cursor: pointer; display: flex; align-items: center; gap: 6px; }
  .btn-nav:disabled { opacity: .35; cursor: not-allowed; }
  .btn-submit { padding: 11px 24px; border: none; border-radius: 8px;
    background: var(--secondary); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }
  .btn-next { padding: 11px 20px; border: none; border-radius: 8px;
    background: var(--primary); color: #fff; font-weight: 700; font-size: 14px; cursor: pointer; }

  /* ── MODAL ── */
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center; z-index: 50; padding: 24px; }
  .overlay.hidden { display: none; }
  .modal { background: var(--card); border-radius: 16px; padding: 28px;
    max-width: 380px; width: 100%; text-align: center; }
  .modal-icon { font-size: 48px; margin-bottom: 12px; }
  .modal-title { font-size: 18px; font-weight: 800; color: var(--text); margin-bottom: 8px; }
  .modal-body { font-size: 14px; color: var(--muted); line-height: 1.6; margin-bottom: 20px; }
  .modal-btn { width: 100%; padding: 13px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor: pointer; margin-top: 8px; }
  .modal-btn.primary { background: var(--primary); color: #fff; }
  .modal-btn.danger  { background: var(--danger);  color: #fff; }
  .modal-btn.outline { background: none; border: 1.5px solid var(--border); color: var(--text); }

  /* ── HASIL ── */
  .hasil-wrap { padding: 40px 20px; max-width: 500px; margin: 0 auto; text-align: center; }
  .hasil-icon { font-size: 72px; margin-bottom: 8px; }
  .hasil-skor { font-size: 64px; font-weight: 800; line-height: 1; margin-bottom: 4px; }
  .hasil-status { font-size: 20px; font-weight: 700; margin-bottom: 24px; }
  .hasil-card { background: var(--card); border-radius: 14px; padding: 16px;
    text-align: left; margin-bottom: 16px; }
  .hasil-row { display: flex; justify-content: space-between; align-items: center;
    padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 14px; }
  .hasil-row:last-child { border-bottom: none; }
  .hasil-row .label { color: var(--muted); }
  .hasil-row .val { font-weight: 700; color: var(--text); }
  .pembahasan-list { text-align: left; margin-bottom: 80px; }
  .pembahasan-item { background: var(--card); border-radius: 10px; padding: 14px;
    margin-bottom: 10px; border-left: 4px solid var(--border); }
  .pembahasan-item.benar  { border-left-color: var(--success); }
  .pembahasan-item.salah  { border-left-color: var(--danger); }
  .pb-header { display: flex; justify-content: space-between;
    font-size: 11px; color: var(--muted); font-weight: 700; margin-bottom: 6px; }
  .pb-pertanyaan { font-size: 13px; color: var(--text); margin-bottom: 8px; line-height: 1.5; }
  .pb-opsi { display: flex; gap: 6px; font-size: 12px; }
  .pb-tag { padding: 3px 8px; border-radius: 6px; font-weight: 600; }
  .pb-tag.dipilih.salah-tag { background: #FEF2F2; color: var(--danger); }
  .pb-tag.benar-tag  { background: #F0FDF4; color: var(--success); }
  .btn-home { padding: 14px 32px; background: var(--primary); color: #fff;
    border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 20px; width: 100%; }
  .btn-remedial { padding: 14px 32px; background: var(--warning); color: #fff;
    border: none; border-radius: 10px; font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 10px; width: 100%; }

  .spinner { display: flex; justify-content: center; align-items: center;
    height: 60vh; }
  .spin { width: 40px; height: 40px; border: 4px solid var(--border);
    border-top-color: var(--primary); border-radius: 50%;
    animation: spin .7s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- Header -->
<div class="header" id="headerEl" style="display:none">
  <button class="btn-close" onclick="confirmKeluar()" title="Keluar">✕</button>
  <div class="header-center">
    <div class="progress-label" id="progressLabel">Soal 1 / 10</div>
    <div class="progress-track">
      <div class="progress-fill" id="progressFill" style="width:10%"></div>
    </div>
  </div>
  <div class="timer" id="timerEl">30:00</div>
  <div class="violation-badge" id="violationBadge" style="display:none">⚠ <span id="violationCount">0</span></div>
</div>

<!-- Loading -->
<div class="spinner" id="loadingEl"><div class="spin"></div></div>

<!-- Soal -->
<div class="soal-wrap" id="soalEl" style="display:none">
  <div class="soal-num" id="soalNum">Soal 1 dari 10</div>
  <div class="soal-text" id="soalText"></div>
  <div id="opsiList"></div>
  <div style="height:80px"></div>
</div>

<!-- Navigasi -->
<div class="nav-bar" id="navBar" style="display:none">
  <button class="btn-nav" id="btnPrev" onclick="prevSoal()" disabled>‹ Sebelumnya</button>
  <button class="btn-next" id="btnNext" onclick="nextSoal()">Selanjutnya ›</button>
  <button class="btn-submit" id="btnSubmit" onclick="confirmSubmit()" style="display:none">Submit ✓</button>
</div>

<!-- Hasil -->
<div class="hasil-wrap" id="hasilEl" style="display:none"></div>

<!-- Modal: Peringatan Tab Switch -->
<div class="overlay hidden" id="tabWarningModal">
  <div class="modal">
    <div class="modal-icon">⚠️</div>
    <div class="modal-title">Peringatan!</div>
    <div class="modal-body" id="tabWarningBody">
      Anda terdeteksi meninggalkan halaman assessment.<br/>
      Aktivitas ini telah <strong>dicatat dan dilaporkan ke guru</strong>.
    </div>
    <button class="modal-btn primary" onclick="closeTabWarning()">Kembali ke Soal</button>
  </div>
</div>

<!-- Modal: Konfirmasi Submit -->
<div class="overlay hidden" id="submitModal">
  <div class="modal">
    <div class="modal-icon">📝</div>
    <div class="modal-title">Konfirmasi Submit</div>
    <div class="modal-body" id="submitModalBody">Yakin ingin mengumpulkan jawaban?</div>
    <button class="modal-btn danger" onclick="doSubmit()">Ya, Submit</button>
    <button class="modal-btn outline" onclick="closeSubmitModal()">Batal</button>
  </div>
</div>

<!-- Modal: Konfirmasi Keluar -->
<div class="overlay hidden" id="keluarModal">
  <div class="modal">
    <div class="modal-icon">🚪</div>
    <div class="modal-title">Keluar Assessment?</div>
    <div class="modal-body">Progress akan hilang dan tidak bisa dikembalikan.</div>
    <button class="modal-btn danger" onclick="window.location.href='/siswa/home'">Ya, Keluar</button>
    <button class="modal-btn outline" onclick="closeModal('keluarModal')">Batal</button>
  </div>
</div>

<script>
// ════════════════════════════════════════════════════════════
//  STATE
// ════════════════════════════════════════════════════════════
const token        = localStorage.getItem('fs_token');
const assessmentId = new URLSearchParams(location.search).get('id');

if (!token) { location.href = '/siswa'; }
if (!assessmentId) { location.href = '/siswa/home'; }

let soalList      = [];
let sesiId        = null;
let currentIdx    = 0;
let jawaban       = {};       // { soal_id: 'a'|'b'|'c'|'d' }
let tabSwitchCount = 0;
let timerInterval = null;
let timeLeft      = 0;
let isSubmitting  = false;

// ════════════════════════════════════════════════════════════
//  HELPER: API
// ════════════════════════════════════════════════════════════
async function api(url, opts = {}) {
  const res = await fetch(url, {
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
    ...opts,
    body: opts.body ? JSON.stringify(opts.body) : undefined,
  });
  if (res.status === 401) { localStorage.clear(); location.href = '/siswa'; }
  return res.json();
}

// ════════════════════════════════════════════════════════════
//  INISIALISASI
// ════════════════════════════════════════════════════════════
async function init() {
  try {
    const data = await api(`/api/assessment/${assessmentId}/soal`);
    if (data.message) { showError(data.message); return; }

    sesiId   = data.sesi_id;
    soalList = data.soal;
    timeLeft = (data.durasi_menit || 30) * 60;

    document.getElementById('loadingEl').style.display = 'none';
    document.getElementById('headerEl').style.display  = 'flex';
    document.getElementById('soalEl').style.display    = 'block';
    document.getElementById('navBar').style.display    = 'flex';

    startTimer();
    renderSoal();
    setupPageVisibility();
  } catch (e) {
    showError('Gagal memuat soal. Periksa koneksi internet.');
  }
}

// ════════════════════════════════════════════════════════════
//  PAGE VISIBILITY API  (inti fitur monitoring)
// ════════════════════════════════════════════════════════════
function setupPageVisibility() {
  document.addEventListener('visibilitychange', handleVisibilityChange);
}

async function handleVisibilityChange() {
  if (document.hidden) {
    tabSwitchCount++;

    // Perbarui badge pelanggaran di header
    document.getElementById('violationBadge').style.display = 'flex';
    document.getElementById('violationCount').textContent   = tabSwitchCount;

    // Kirim log ke backend
    try {
      await api(`/api/assessment/${assessmentId}/activity`, {
        method: 'POST',
        body: { sesi_id: sesiId, jenis: 'tab_switch',
                keterangan: `Halaman tidak aktif — pelanggaran ke-${tabSwitchCount}` },
      });
    } catch (_) {}
  } else {
    // Siswa kembali ke halaman → tampilkan peringatan
    if (tabSwitchCount > 0) showTabWarning();
  }
}

// ════════════════════════════════════════════════════════════
//  TIMER
// ════════════════════════════════════════════════════════════
function startTimer() {
  renderTimer();
  timerInterval = setInterval(() => {
    timeLeft--;
    renderTimer();
    if (timeLeft <= 0) { clearInterval(timerInterval); doSubmit(true); }
  }, 1000);
}

function renderTimer() {
  const m   = String(Math.floor(timeLeft / 60)).padStart(2, '0');
  const s   = String(timeLeft % 60).padStart(2, '0');
  const el  = document.getElementById('timerEl');
  el.textContent = `${m}:${s}`;
  el.className   = 'timer' + (timeLeft < 60 ? ' urgent' : '');
}

// ════════════════════════════════════════════════════════════
//  RENDER SOAL
// ════════════════════════════════════════════════════════════
function renderSoal() {
  const soal  = soalList[currentIdx];
  const total = soalList.length;

  document.getElementById('soalNum').textContent   = `Soal ${currentIdx + 1} dari ${total}`;
  document.getElementById('soalText').textContent  = soal.pertanyaan;
  document.getElementById('progressLabel').textContent = `Soal ${currentIdx + 1} / ${total}`;
  document.getElementById('progressFill').style.width  = `${((currentIdx + 1) / total) * 100}%`;

  const opsiList = document.getElementById('opsiList');
  opsiList.innerHTML = ['a', 'b', 'c', 'd'].map(opt => `
    <div class="opsi ${jawaban[soal.id] === opt ? 'selected' : ''}"
         onclick="pilihJawaban('${opt}')">
      <div class="opsi-circle">${opt.toUpperCase()}</div>
      <div class="opsi-text">${soal[`opsi_${opt}`]}</div>
    </div>
  `).join('');

  // Navigasi
  document.getElementById('btnPrev').disabled = currentIdx === 0;
  const isLast = currentIdx === total - 1;
  document.getElementById('btnNext').style.display   = isLast ? 'none' : 'block';
  document.getElementById('btnSubmit').style.display = isLast ? 'block' : 'none';
}

function pilihJawaban(opt) {
  jawaban[soalList[currentIdx].id] = opt;
  renderSoal();
}

function prevSoal() { if (currentIdx > 0) { currentIdx--; renderSoal(); } }
function nextSoal() { if (currentIdx < soalList.length - 1) { currentIdx++; renderSoal(); } }

// ════════════════════════════════════════════════════════════
//  SUBMIT
// ════════════════════════════════════════════════════════════
function confirmSubmit() {
  const belum = soalList.length - Object.keys(jawaban).length;
  document.getElementById('submitModalBody').innerHTML = belum > 0
    ? `Masih ada <strong>${belum} soal</strong> yang belum dijawab. Soal yang belum dijawab dianggap salah.<br/><br/>Yakin ingin mengumpulkan?`
    : 'Semua soal sudah dijawab. Yakin ingin mengumpulkan?';
  openModal('submitModal');
}

async function doSubmit(auto = false) {
  if (isSubmitting) return;
  isSubmitting = true;
  closeModal('submitModal');
  clearInterval(timerInterval);
  document.removeEventListener('visibilitychange', handleVisibilityChange);

  // Sembunyikan soal + nav
  document.getElementById('soalEl').style.display = 'none';
  document.getElementById('navBar').style.display = 'none';
  document.getElementById('headerEl').style.display = 'none';
  document.getElementById('loadingEl').style.display = 'flex';

  const jawabanArr = soalList.map(s => ({
    soal_id: s.id,
    jawaban: jawaban[s.id] || 'a',
  }));

  try {
    const data = await api(`/api/assessment/${assessmentId}/submit`, {
      method: 'POST',
      body: { sesi_id: sesiId, jawaban: jawabanArr },
    });
    document.getElementById('loadingEl').style.display = 'none';
    renderHasil(data);
  } catch {
    document.getElementById('loadingEl').style.display = 'none';
    showError('Gagal menyimpan jawaban. Coba lagi.');
    isSubmitting = false;
  }
}

// ════════════════════════════════════════════════════════════
//  RENDER HASIL
// ════════════════════════════════════════════════════════════
function renderHasil(data) {
  const lulus      = data.lulus;
  const skor       = Math.round(data.skor);
  const warnSkor   = lulus ? '#22C55E' : '#E24B4A';
  const statusText = lulus ? '🎉 LULUS!' : 'BELUM LULUS';
  const ikon       = lulus ? '✅' : '❌';

  let rows = `
    <div class="hasil-row"><span class="label">Skor Mentah</span>
      <span class="val">${Math.round(data.skor_mentah)}%</span></div>`;
  if (data.potongan_terlambat > 0)
    rows += `<div class="hasil-row"><span class="label">Potongan Terlambat</span>
      <span class="val" style="color:var(--danger)">-${data.potongan_terlambat}%</span></div>`;
  if (data.potongan_remedial > 0)
    rows += `<div class="hasil-row"><span class="label">Potongan Remedial</span>
      <span class="val" style="color:var(--warning)">-${data.potongan_remedial}%</span></div>`;
  rows += `<div class="hasil-row"><span class="label">Percobaan ke-</span>
    <span class="val">${data.percobaan_ke}</span></div>`;
  if (tabSwitchCount > 0)
    rows += `<div class="hasil-row"><span class="label">Pelanggaran Terdeteksi</span>
      <span class="val" style="color:var(--danger)">${tabSwitchCount}x berpindah halaman</span></div>`;

  const pembahasan = (data.pembahasan || []).map((p, i) => `
    <div class="pembahasan-item ${p.benar ? 'benar' : 'salah'}">
      <div class="pb-header">
        <span>Soal ${i + 1}</span>
        <span style="color:${p.benar ? 'var(--success)' : 'var(--danger)'}">
          ${p.benar ? '✓ Benar' : '✗ Salah'}</span>
      </div>
      <div class="pb-pertanyaan">${p.pertanyaan}</div>
      <div class="pb-opsi">
        <span class="pb-tag dipilih ${p.benar ? 'benar-tag' : 'salah-tag'}">
          Jawaban: ${(p.jawaban_dipilih || '').toUpperCase()}</span>
        ${!p.benar ? `<span class="pb-tag benar-tag">Benar: ${(p.jawaban_benar || '').toUpperCase()}</span>` : ''}
      </div>
    </div>`).join('');

  document.getElementById('hasilEl').innerHTML = `
    <div class="hasil-icon">${ikon}</div>
    <div class="hasil-skor" style="color:${warnSkor}">${skor}</div>
    <div class="hasil-status" style="color:${warnSkor}">${statusText}</div>
    <div class="hasil-card">${rows}</div>
    <div class="pembahasan-list">${pembahasan}</div>
    ${data.bisa_remedial ? `<button class="btn-remedial"
      onclick="window.location.href='/siswa/assessment?id=${assessmentId}'">🔄 Ikuti Remedial</button>` : ''}
    <button class="btn-home" onclick="window.location.href='/siswa/home'">🏠 Kembali ke Beranda</button>
  `;
  document.getElementById('hasilEl').style.display = 'block';
}

// ════════════════════════════════════════════════════════════
//  MODAL HELPERS
// ════════════════════════════════════════════════════════════
function showTabWarning() {
  document.getElementById('tabWarningBody').innerHTML =
    `Anda terdeteksi meninggalkan halaman assessment.<br/>
     Aktivitas ini telah <strong>dicatat dan dilaporkan ke guru</strong>.<br/><br/>
     <strong style="color:var(--danger)">Pelanggaran ke-${tabSwitchCount}</strong>`;
  openModal('tabWarningModal');
}
function closeTabWarning() { closeModal('tabWarningModal'); }
function confirmKeluar()   { openModal('keluarModal'); }
function closeSubmitModal(){ closeModal('submitModal'); }
function openModal(id)     { document.getElementById(id).classList.remove('hidden'); }
function closeModal(id)    { document.getElementById(id).classList.add('hidden'); }

function showError(msg) {
  document.getElementById('loadingEl').style.display = 'none';
  document.body.innerHTML += `
    <div style="text-align:center;padding:60px 20px">
      <div style="font-size:48px;margin-bottom:16px">⚠️</div>
      <p style="color:var(--danger);font-weight:600;margin-bottom:16px">${msg}</p>
      <button onclick="history.back()" style="padding:12px 24px;background:var(--primary);
        color:#fff;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer">
        Kembali</button>
    </div>`;
}

// ════════════════════════════════════════════════════════════
//  START
// ════════════════════════════════════════════════════════════
init();
</script>
</body>
</html>
