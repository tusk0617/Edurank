<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>FrontSchooler — Login Siswa</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --primary: #378ADD;
    --secondary: #639922;
    --danger: #E24B4A;
    --bg: #F8F9FA;
    --card: #ffffff;
    --text: #1A1A1A;
    --muted: #6B7280;
    --border: #E5E7EB;
  }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg); min-height: 100vh; display: flex;
    flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .logo-section { text-align: center; margin-bottom: 32px; }
  .logo-circle { width: 80px; height: 80px; border-radius: 50%;
    background: var(--primary); display: inline-flex; align-items: center;
    justify-content: center; font-size: 36px; margin-bottom: 12px;
    box-shadow: 0 4px 16px rgba(55,138,221,0.35); }
  .logo-title { font-size: 28px; font-weight: 800; color: var(--primary); }
  .logo-sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .card { background: var(--card); border-radius: 16px; padding: 28px;
    width: 100%; max-width: 400px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
  .form-group { margin-bottom: 16px; }
  label { display: block; font-size: 13px; font-weight: 600;
    color: var(--text); margin-bottom: 6px; }
  input { width: 100%; padding: 12px 14px; border: 1.5px solid var(--border);
    border-radius: 10px; font-size: 15px; color: var(--text);
    background: var(--bg); outline: none; transition: border-color .2s; }
  input:focus { border-color: var(--primary); }
  .btn { width: 100%; padding: 14px; border: none; border-radius: 10px;
    font-size: 15px; font-weight: 700; cursor: pointer;
    background: var(--primary); color: #fff; margin-top: 8px;
    box-shadow: 0 3px 10px rgba(55,138,221,0.3); transition: opacity .2s; }
  .btn:disabled { opacity: .6; cursor: not-allowed; }
  .info-box { margin-top: 20px; padding: 12px; background: #EBF4FF;
    border-radius: 8px; border-left: 3px solid var(--primary); }
  .info-box p { font-size: 12px; color: var(--muted); line-height: 1.6; }
  .info-box strong { color: var(--primary); }
  .error { color: var(--danger); font-size: 13px; margin-top: 8px; text-align: center; }
  .spinner { display: inline-block; width: 18px; height: 18px;
    border: 2px solid #fff3; border-top-color: #fff;
    border-radius: 50%; animation: spin .7s linear infinite; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="logo-section">
  <div class="logo-circle">📐</div>
  <div class="logo-title">FrontSchooler</div>
  <div class="logo-sub">Platform Assessment Matematika</div>
</div>

<div class="card">
  <div class="form-group">
    <label for="username">Username</label>
    <input id="username" type="text" placeholder="Masukkan username" autocomplete="username" />
  </div>
  <div class="form-group">
    <label for="password">Password</label>
    <input id="password" type="password" placeholder="Masukkan password" autocomplete="current-password" />
  </div>
  <button class="btn" id="loginBtn" onclick="handleLogin()">Masuk</button>
  <div class="error" id="errMsg"></div>

  <div class="info-box">
    <p><strong>Info Login Siswa:</strong><br/>
    Username: S001 – S035<br/>
    Password: password123</p>
  </div>
</div>

<script>
  // Redirect jika sudah login
  const token = localStorage.getItem('fs_token');
  const role  = localStorage.getItem('fs_role');
  if (token && role === 'siswa') window.location.href = '/siswa/home';

  async function handleLogin() {
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value.trim();
    const btn      = document.getElementById('loginBtn');
    const errMsg   = document.getElementById('errMsg');

    if (!username || !password) { errMsg.textContent = 'Username dan password wajib diisi'; return; }

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Memuat...';
    errMsg.textContent = '';

    try {
      const res  = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username, password }),
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.message || 'Login gagal');

      if (data.user.role !== 'siswa') {
        throw new Error('Halaman ini khusus siswa. Guru gunakan aplikasi mobile.');
      }

      localStorage.setItem('fs_token', data.token);
      localStorage.setItem('fs_role', data.user.role);
      localStorage.setItem('fs_nama', data.user.nama);
      localStorage.setItem('fs_username', data.user.username);
      window.location.href = '/siswa/home';
    } catch (err) {
      errMsg.textContent = err.message;
      btn.disabled = false;
      btn.textContent = 'Masuk';
    }
  }

  // Enter key
  document.addEventListener('keydown', e => { if (e.key === 'Enter') handleLogin(); });
</script>
</body>
</html>
